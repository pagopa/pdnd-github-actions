name: Deploy Job manually on env
on:
  workflow_call:
    inputs:
      environment:
        description: 'Choose the environment'
        required: true
        type: string
      codebuild-runner:
        description: "Codebuild runner name"
        required: true
        type: string
      virtual-env:
        description: 'Choose the virtual-env to deploy'
        required: true
        type: string
      config:
        description: 'Choose the config to deploy'
        required: true
        type: string
      deploy-type:
        description: 'Deploy on spark or airflow'
        required: true
        type: string
jobs:
  prepare_deploy:
    environment:
      name: ${{ inputs.environment }}
    runs-on: ${{ inputs.codebuild-runner }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Hack container for local development
        if: ${{ env.ACT }}
        run: echo /runnertmp/externals/node16/bin/ >> $GITHUB_PATH
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
      - name: Extract cde config
        id: extract-deploy-configs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let conf = ".github/workflows/config/${{ github.event.inputs.virtual-env }}/${{ github.event.inputs.config }}.json"
            const data = fs.readFileSync(conf, 'utf8');
            conf = JSON.parse(data);
            console.log("using deploy config : ")
            console.log(conf)
            return conf
    outputs:
        deploy_configs: ${{ steps.extract-deploy-configs.outputs.result }}
  deploy-airflow:
      if:  inputs.deploy-type  == 'airflow'
      needs:
        - prepare_deploy
      uses: ./.github/workflows/deploy-cde-airflow.yml
      secrets: inherit
      with:
          environment: ${{ inputs.environment }}
          codebuild-runner: ${{ inputs.codebuild-runner }}
          config-json: ${{ toJson(needs.prepare_deploy.outputs.deploy_configs) }}
          virtual-env: ${{ inputs.virtual-env }}
  deploy-spark:
    if:  inputs.deploy-type  == 'spark'
    needs:
      - prepare_deploy
    uses: ./.github/workflows/deploy-cde-spark.yml
    secrets: inherit
    with:
        environment: ${{ inputs.environment }}
        codebuild-runner: ${{ inputs.codebuild-runner }}
        config-json: ${{ toJson(needs.prepare_deploy.outputs.deploy_configs) }}
        virtual-env: ${{ inputs.virtual-env }}