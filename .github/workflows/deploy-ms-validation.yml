name: VAL | Deploy candidate
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub deployment environment
        type: string
        default: "val"
      environment-values:
        description: File stem under .k8s/helm/env-values
        type: string
        default: "val"
      validation-branch:
        description: Branch containing the candidate
        type: string
        default: "validation"
      base-branch:
        description: Branch candidates must include before approval
        type: string
        default: "main"
      status-context:
        description: Commit status invalidated by a new deployment
        type: string
        default: "validation/promotion-policy"
      artifact-name:
        description: Name of the archived candidate
        type: string
        default: "val-candidate"
      source-workflow:
        description: Expected caller workflow path
        type: string
        default: ".github/workflows/deploy-ms-validation.yml"
      hotfix-prefix:
        description: Allowed hotfix branch prefix; empty disables hotfixes
        type: string
        default: "hotfix/"
      expected-cluster:
        description: Expected EKS cluster; validated against environment configuration
        type: string
        required: true
      timeout:
        description: Helm deployment timeout
        type: string
        default: "20m"
      smoke-test-timeout:
        description: Deprecated compatibility input; Helm tests are not run
        type: string
        default: "5m"
      codebuild-runner:
        type: string
        required: true
      ticket:
        type: string
        default: ""
      companion:
        description: Optional versions of companion services included in the test session
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  deployments: write
  pull-requests: read
  statuses: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Check invocation
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          VALIDATION_BRANCH: ${{ inputs.validation-branch }}
          HOTFIX_PREFIX: ${{ inputs.hotfix-prefix }}
          ATTEMPT: ${{ github.run_attempt }}
          RUNNER: ${{ inputs.codebuild-runner }}
        run: |
          set -euo pipefail
          [[ "$EVENT" == workflow_dispatch && "$ATTEMPT" == 1 ]]
          [[ "$REF" == "refs/heads/$VALIDATION_BRANCH" || ( -n "$HOTFIX_PREFIX" && "$REF" == "refs/heads/$HOTFIX_PREFIX"* && "$REF" != "refs/heads/$HOTFIX_PREFIX" ) ]]
          [[ -n "$RUNNER" ]]

  deploy:
    env:
      VALUES_NAME: ${{ inputs.environment-values }}
      HELM_TIMEOUT: ${{ inputs.timeout }}
    needs: preflight
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    runs-on: ${{ inputs.codebuild-runner }}-${{ github.run_id }}-${{ github.run_attempt }}
    concurrency:
      group: microservice-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate VAL configuration
        env:
          DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
          ACCOUNT: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
          CLUSTER: ${{ vars.EKS_CLUSTER }}
          EXPECTED_CLUSTER: ${{ inputs.expected-cluster }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ENVIRONMENT" == "$VALUES_NAME" && -n "$CLUSTER" && "$CLUSTER" == "$EXPECTED_CLUSTER" ]]
          [[ "$ACCOUNT" =~ ^[0-9]{12}$ && -n "$REGION" ]]
          [[ "$VALUES_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]
          image=$(yq -r '.image.repository' ".k8s/helm/env-values/$VALUES_NAME.yaml")
          [[ "$image" == "$ACCOUNT.dkr.ecr.$REGION.amazonaws.com/${GITHUB_REPOSITORY#*/}" ]]
      - name: Resolve promoted image and snapshot chart
        env:
          ACCOUNT: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TICKET: ${{ inputs.ticket }}
          COMPANION: ${{ inputs.companion }}
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "$ACCOUNT" ]]
          image="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/${GITHUB_REPOSITORY#*/}"
          tag="val-$GITHUB_SHA"
          digest=$(aws ecr describe-images --registry-id "$ACCOUNT" --repository-name "${GITHUB_REPOSITORY#*/}" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text) || {
            echo "No promoted VAL image found for $GITHUB_SHA. Check the VAL promotion workflow." >&2
            exit 1
          }
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/val-candidate"
          export CANDIDATE_DIGEST="$digest"
          yq -i '.image.digest = strenv(CANDIDATE_DIGEST)' ".k8s/helm/env-values/$VALUES_NAME.yaml"
          helm lint .k8s/helm -f ".k8s/helm/env-values/$VALUES_NAME.yaml"
          helm package .k8s/helm --destination "$RUNNER_TEMP/val-candidate"
          mv "$RUNNER_TEMP/val-candidate/"*.tgz "$RUNNER_TEMP/val-candidate/val-chart.tgz"
          chart_sha=$(sha256sum "$RUNNER_TEMP/val-candidate/val-chart.tgz" | cut -d ' ' -f1)
          tree=$(git rev-parse 'HEAD^{tree}')
          namespace=$(yq -r '.namespace' .k8s/helm/values.yaml)
          jq -n --arg sha "$GITHUB_SHA" --arg tree "$tree" --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" --arg branch "$GITHUB_REF_NAME" --arg digest "$digest" \
            --arg image "$image" --arg ticket "$TICKET" --arg companion "$COMPANION" \
            --arg chart_sha256 "$chart_sha" --arg namespace "$namespace" \
            '{schema:1, repository:$repository, sha:$sha, tree:$tree, run_id:$run_id, branch:$branch,
              digest:$digest, image:$image, ticket:$ticket, companion:$companion,
              chart_sha256:$chart_sha256, namespace:$namespace}' > "$RUNNER_TEMP/val-candidate/candidate.json"
      - name: Mark VAL deployment in progress
        uses: pagopa/pdnd-github-actions/validation-candidate@DLD-1569_new-val-cicd-prossima
        with:
          prod-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          base-branch: ${{ inputs.base-branch }}
          validation-branch: ${{ inputs.validation-branch }}
          hotfix-prefix: ${{ inputs.hotfix-prefix }}
          deployment-environment: ${{ inputs.environment }}
          status-context: ${{ inputs.status-context }}
          artifact-name: ${{ inputs.artifact-name }}
          source-workflow: ${{ inputs.source-workflow }}
          mode: record
          deployment-state: in_progress
          candidate-file: ${{ runner.temp }}/val-candidate/candidate.json
          token: ${{ github.token }}
      - name: Deploy candidate
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CLUSTER: ${{ vars.EKS_CLUSTER }}
        run: |
          set -euo pipefail
          namespace=$(jq -r '.namespace' "$RUNNER_TEMP/val-candidate/candidate.json")
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"
          helm upgrade --install "${GITHUB_REPOSITORY#*/}" "$RUNNER_TEMP/val-candidate/val-chart.tgz" \
            -n "$namespace" -f .k8s/helm/values.yaml -f ".k8s/helm/env-values/$VALUES_NAME.yaml" --atomic --timeout "$HELM_TIMEOUT"
      - name: Record actual VAL state
        uses: pagopa/pdnd-github-actions/validation-candidate@DLD-1569_new-val-cicd-prossima
        with:
          prod-account-id: ${{ vars.PROD_AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          base-branch: ${{ inputs.base-branch }}
          validation-branch: ${{ inputs.validation-branch }}
          hotfix-prefix: ${{ inputs.hotfix-prefix }}
          deployment-environment: ${{ inputs.environment }}
          status-context: ${{ inputs.status-context }}
          artifact-name: ${{ inputs.artifact-name }}
          source-workflow: ${{ inputs.source-workflow }}
          mode: record
          candidate-file: ${{ runner.temp }}/val-candidate/candidate.json
          token: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/val-candidate/
          if-no-files-found: error
          retention-days: 90
      - name: Record candidate
        run: |
          { echo '### VAL candidate — functional approval on pull request required'; echo '```json'; cat "$RUNNER_TEMP/val-candidate/candidate.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
