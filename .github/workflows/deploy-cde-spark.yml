name: Deploy CDE Spark Job
on:
  workflow_call:
    inputs:
      environment:
        description: 'Choose the environment'
        required: true
        type: string
      codebuild-runner:
        description: "Codebuild runner name"
        required: true
        type: string
      config-json:
        description: 'config to deploy'
        type: string
        required: true
      virtual-env:
        description: 'the virtual env to deploy on'
        type: string
        required: true
jobs:
  parse-config:
    environment:
      name: ${{ inputs.environment }}
    runs-on: ${{ inputs.codebuild-runner }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Hack container for local development
        if: ${{ env.ACT }}
        run: echo /runnertmp/externals/node16/bin/ >> $GITHUB_PATH
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
      - name: Validate schema write file
        run: |
          echo ${{ inputs.config-json }} | sed 's/\\"/"/g' | jq . > input_config.json
          echo '{"$schema": "http://json-schema.org/draft-07/schema#","type": "object","properties": {"job": {"type": "object","properties": {"name": {"type": "string"},"application-file": {"type": "string"},"dag-file": {"type": "string"}},"required": ["name"],"additionalProperties": true},"resources": {"type": "array","minItems": 1,"items": {"type": "object","properties": {"create": {"type": "object","additionalProperties": true},"upload": {"type": "array","minItems": 1,"items": {"type": "object","additionalProperties": true}}},"required": ["create", "upload"],"additionalProperties": true}},"py_files_package": {"type": "object","properties": {"enabled": {"type": "boolean"},"archive_name": {"type": "string"},"resource": {"type": "string"}},"additionalProperties": true},"job_default_args": {"type": "boolean"},"owner": {"type": "string"},"base_dir": {"type": "string"}},"required": ["job", "base_dir", "resources"],"additionalProperties": false}' > schema.json
      - name: Validate schema
        uses: cardinalby/schema-validator-action@95ce895b6846cc7d931785fcaa46c84816753612 #3.1.2
        with:
          file: 'input_config.json'
          schema: 'schema.json'
      - name: Build commands
        id: parse_json
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9
        with:
          script: |
            function buildOptions(json){
                var command = '';
                for (const [key, value] of Object.entries(json)) {
                    if (typeof value === 'boolean') {
                        if (value) {
                            command += ` --${key}`;
                        }
                    }
                    else if (Array.isArray(value)) {
                        value.forEach(element => {
                            command += ` --${key}="${element}"`;
                        });
                    } else if (typeof value === 'object' && value !== null) {
                        throw new Error(`Unsupported nested object for key: ${key}`);
                    } else {
                        command += ` --${key}="${value}"`;
                    }
                }
                return command;
            }

            function addDefaultJobArgs(conf){
              let additionalArgs = "";
              if (conf.job_default_args){
                additionalArgs = " --arg --knox_config.gateway ";
                additionalArgs += " --arg ${{ vars.KNOX_GATEWAY }} ";
                additionalArgs += " --arg --knox_config.hostname ";
                additionalArgs += " --arg ${{ vars.KNOX_HOSTNAME }} ";
              }
              return additionalArgs;
            }

            const config = JSON.parse(${{ inputs.config-json }});
            console.log("Using configuration:", config);
            const command_sequence = [];

            const isZipEnabled = config.py_files_package && config.py_files_package.enabled === true;
            const defaultZipName = `${config.base_dir || config.job.name}.zip`;
            const zipName = (config.py_files_package && config.py_files_package.archive_name) || defaultZipName;
            const zipResource = (config.py_files_package && config.py_files_package.resource) || config.job["mount-1-resource"] || config.job.name;

            function addPyFilesOption() {
              if (isZipEnabled) {
                return ` --py-files="/app/mount/${zipName}" `;
              }
              return "";
            }

            let opts = buildOptions(config.job) + addDefaultJobArgs(config) + addPyFilesOption();

            const job_delete_cmd = `
                if cde job describe --name ${config.job.name} >/dev/null 2>&1; then
                  cde job delete --name ${config.job.name}
                fi;
            `;
            command_sequence.push(job_delete_cmd);

            config.resources.forEach(resource => {
              const create_cmd = `
                  if cde resource describe --name ${resource.create.name} >/dev/null 2>&1; then
                    cde resource delete --name ${resource.create.name}
                  fi
                  cde resource create ${buildOptions(resource.create)}
              `;
              command_sequence.push(create_cmd);
              resource.upload.forEach(upload => {
                const upload_cmd = "cde resource upload " + buildOptions(upload);
                command_sequence.push(upload_cmd);
              });
            });

            if (isZipEnabled) {
              const upload_zip_cmd = `cde resource upload --name ${zipResource} --local-path ${zipName}`;
              command_sequence.push(upload_zip_cmd);
            }

            const job_create_cmd = `
                cde job create --type="spark" ${opts}
            `;
            command_sequence.push(job_create_cmd);

            const res = {
                "commands": command_sequence,
                "vcluster": "${{ vars[format('VCLUSTER_ENDPOINT_{0}', inputs.virtual-env)] }}",
                "py_files_package": config.py_files_package,
                "archive_name": zipName,
                "base_dir": config.base_dir,
                "job_default_args": config.job_default_args
            };
            return res;
    outputs:
      parsed_config: ${{ steps.parse_json.outputs.result }}

  build-pyfiles:
    name: Build Py-Files
    environment:
      name: ${{ inputs.environment }}
    if: ${{ fromJson(needs.parse-config.outputs.parsed_config).py_files_package && fromJson(needs.parse-config.outputs.parsed_config).py_files_package.enabled }}
    needs:
      - parse-config
    runs-on: ${{ inputs.codebuild-runner }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
      - name: Create ZIP archive
        working-directory: ${{ fromJson(needs.parse-config.outputs.parsed_config).base_dir }}
        run: |
          ZIP_NAME="${{ fromJson(needs.parse-config.outputs.parsed_config).archive_name }}"
          echo "Packaging py-files into $ZIP_NAME..."
          if [ -d "src" ]; then
            cd src
            zip -r "../$ZIP_NAME" . -x "*tests/*" -x "*test/*" -x "*__pycache__/*" -x "*.pyc" -x "*.pytest_cache/*"
            cd ..
          else
            zip -r "$ZIP_NAME" . -x "*tests/*" -x "*test/*" -x "*__pycache__/*" -x "*.pyc" -x "*.pytest_cache/*" -x "*.venv/*"
          fi
      - name: Upload Py-Files Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: py-files-artifact
          path: ${{ fromJson(needs.parse-config.outputs.parsed_config).base_dir }}/${{ fromJson(needs.parse-config.outputs.parsed_config).archive_name }}
          overwrite: true

  execute-commands:
    environment:
      name: ${{ inputs.environment }}
    name: Execute commands
    runs-on: ${{ inputs.codebuild-runner }}-${{ github.run_id }}-${{ github.run_attempt }}
    needs:
      - parse-config
      - build-pyfiles
    if: |
      always() &&
      needs.parse-config.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    strategy:
      max-parallel: 1
      matrix:
        command: ${{ fromJson(needs.parse-config.outputs.parsed_config).commands }}
    steps:
      - name: Hack container for local development
        if: ${{ env.ACT }}
        run: echo /runnertmp/externals/node16/bin/ >> $GITHUB_PATH
      - name: Get secrets from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53
        with:
          secret-ids: |
            CDP_AUTH,${{ vars.AWS_SECRET_CDP_AUTH }}
          parse-json-secrets: true
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: ${{ fromJson(needs.parse-config.outputs.parsed_config).py_files_package && fromJson(needs.parse-config.outputs.parsed_config).py_files_package.enabled }}
        with:
          name: py-files-artifact
          path: ${{ fromJson(needs.parse-config.outputs.parsed_config).base_dir }}
      - name: Setup CDE CLI
        uses: pagopa/pdnd-github-actions/setup-cde-cli@82eed1f3ff421aed8de777b7cb3f1bfb0a4a2475
        with:
            version: "1.20.3"
            access_key_id: ${{ env.CDP_AUTH_ACCESS_KEY_ID }}
            private_key: ${{ env.CDP_AUTH_PRIVATE_KEY }}
            codeartifact_domain: ${{ vars.CODEARTIFACT_DOMAIN }}
            codeartifact_repository: ${{ vars.CODEARTIFACT_REPOSITORY }}
            vcluster_endpoint: ${{ vars[format('VCLUSTER_ENDPOINT_{0}', inputs.virtual-env)] }}
      - name: Run commands
        working-directory: ${{ fromJson(needs.parse-config.outputs.parsed_config).base_dir }}
        run: |
          echo executing command : '${{ matrix.command }}'
          eval "${{ matrix.command }}"